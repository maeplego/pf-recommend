# Always-on unit + vuln CI.
# Compose up, Playwright browsers, and Docker Desktop Kubernetes are not in this
# workflow: hosted runners have no Desktop cluster, and image builds are too slow
# for every push. See portfolio-plan/ci.md in the meta repo.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install
        run: python -m pip install -e ".[dev,api,train]"
      - name: pytest
        run: python -m pytest
      - name: pip-audit
        run: |
          python -m pip install pip-audit
          python -m pip_audit
  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem (HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8  # v0.36.0 (pin SHA after 2026-03 tag hijack)
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          trivyignores: .trivyignore
  kustomize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
        with:
          version: "v1.31.4"
      - name: client dry-run of this repo's manifests
        run: kubectl kustomize deploy/k8s
  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: validate Compose file without starting containers
        run: docker compose -f deploy/compose.yaml config
