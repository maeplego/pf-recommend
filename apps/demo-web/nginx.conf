server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /v1/ {
        proxy_pass http://recommend-api:8098/v1/;
    }

    location /health {
        proxy_pass http://recommend-api:8098/health;
    }

    location /ready {
        proxy_pass http://recommend-api:8098/ready;
    }

    location /docs {
        proxy_pass http://recommend-api:8098/docs;
    }

    location /openapi.json {
        proxy_pass http://recommend-api:8098/openapi.json;
    }
}
