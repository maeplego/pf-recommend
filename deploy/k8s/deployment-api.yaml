apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app: recommend-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: recommend-api
  template:
    metadata:
      labels:
        app: recommend-api
    spec:
      volumes:
        - name: models
          emptyDir: {}
      initContainers:
        - name: train
          image: pf-recommend-train:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: RECOMMEND_MODELS_DIR
              value: /models
          volumeMounts:
            - name: models
              mountPath: /models
      containers:
        - name: api
          image: pf-recommend-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8098
              name: http
          env:
            - name: RECOMMEND_HTTP_PORT
              value: "8098"
            - name: RECOMMEND_MODELS_DIR
              value: /models
          volumeMounts:
            - name: models
              mountPath: /models
              readOnly: true
          readinessProbe:
            httpGet:
              path: /ready
              port: 8098
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8098
            initialDelaySeconds: 10
            periodSeconds: 10
