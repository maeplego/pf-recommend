[project]
name = "pf-recommend"
version = "0.1.0"
description = "P07 recommendation training and inference (MovieLens + shared API for P06/P10)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.8",
]

[project.optional-dependencies]
api = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
]
train = [
  "numpy>=2.0",
  "pandas>=2.2",
  "scikit-learn>=1.5",
  "scipy>=1.13",
]
dev = [
  "httpx>=0.27",
  "pytest>=8.3",
]

[project.scripts]
recommend-train = "recommend_train.cli:main"

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = [
  "packages/metrics/src",
  "packages/schemas/src",
  "packages/runtime/src",
  "apps/api/src",
  "apps/train/src",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
  "packages/metrics/src",
  "packages/schemas/src",
  "packages/runtime/src",
  "apps/api/src",
  "apps/train/src",
]
addopts = "-q"
